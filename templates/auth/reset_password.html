{% extends 'base.html' %}

{% block title %}Set New Password - Atlas Tourism{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="feature-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.4rem;">
                        <i class="bi bi-lock"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Set New Password</h3>
                    <p class="text-muted small">Update your account credentials for <strong>{{ user.email }}</strong></p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label for="new_password" class="form-label fw-semibold small">New Password</label>
                        <div class="input-password-wrapper">
                            <input type="password" class="form-control pe-5" id="new_password" name="new_password" 
                                   placeholder="Min 6 characters" minlength="6" required>
                            <button type="button" class="password-toggle-btn" data-target="new_password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold small">Confirm New Password</label>
                        <div class="input-password-wrapper">
                            <input type="password" class="form-control pe-5" id="confirm_password" name="confirm_password" 
                                   placeholder="Re-enter new password" minlength="6" required>
                            <button type="button" class="password-toggle-btn" data-target="confirm_password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        Update Password & Log In <i class="bi bi-check2-circle ms-1"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
