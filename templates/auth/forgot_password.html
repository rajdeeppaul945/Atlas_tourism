{% extends 'base.html' %}

{% block title %}Forgot Password - Atlas Tourism{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="feature-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.4rem;">
                        <i class="bi bi-key"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Reset Password</h3>
                    <p class="text-muted small">Enter your registered email address to receive password reset instructions.</p>
                </div>

                <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold small">Registered Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" 
                                   placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        Send Reset Link <i class="bi bi-send ms-1"></i>
                    </button>
                </form>

                <div class="mt-4 pt-3 text-center border-top">
                    <a href="{{ url_for('auth.login') }}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Return to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
