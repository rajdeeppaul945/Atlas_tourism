{% extends 'base.html' %}

{% block title %}Sign In - Atlas Tourism{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="feature-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.4rem;">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your Atlas Tourism traveller account</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label for="identifier" class="form-label fw-semibold small">Email or Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="identifier" name="identifier" 
                                   value="{{ identifier if identifier else '' }}" placeholder="name@example.com or username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="login-password" class="form-label fw-semibold small mb-0">Password</label>
                            <a href="{{ url_for('auth.forgot_password') }}" class="small text-decoration-none text-primary-custom">Forgot password?</a>
                        </div>
                        <div class="input-password-wrapper">
                            <input type="password" class="form-control pe-5" id="login-password" name="password" 
                                   placeholder="Enter your password" required>
                            <button type="button" class="password-toggle-btn" data-target="login-password" title="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
                        <label class="form-check-label small text-muted" for="remember_me">
                            Keep me logged in
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        Sign In <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="mt-4 pt-3 text-center border-top">
                    <p class="text-muted small mb-0">
                        Don't have an account yet? 
                        <a href="{{ url_for('auth.register') }}" class="text-primary-custom fw-semibold text-decoration-none">Create Account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
