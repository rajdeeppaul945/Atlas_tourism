{% extends 'base.html' %}

{% block title %}System Error - Atlas Tourism{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <i class="bi bi-exclamation-triangle-fill text-warning display-1 d-block mb-4"></i>
        <h1 class="display-3 fw-bold text-dark">500</h1>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted mx-auto mb-4" style="max-width: 500px;">
            Something unexpected occurred while processing your request. Please rest assured our technical team is looking into it.
        </p>
        <a href="{{ url_for('home.index') }}" class="btn btn-primary px-4 py-2">
            <i class="bi bi-house me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
