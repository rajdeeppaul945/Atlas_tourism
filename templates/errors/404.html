{% extends 'base.html' %}

{% block title %}Page Not Found - Atlas Tourism{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <i class="bi bi-compass text-muted display-1 d-block mb-4"></i>
        <h1 class="display-3 fw-bold text-dark">404</h1>
        <h3 class="fw-bold mb-3">Destination Not Found</h3>
        <p class="text-muted mx-auto mb-4" style="max-width: 500px;">
            The page or holiday package you are searching for might have been moved, renamed, or is temporarily unavailable.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('home.index') }}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-house me-1"></i> Return Home
            </a>
            <a href="{{ url_for('packages.index') }}" class="btn btn-outline-primary px-4 py-2">
                <i class="bi bi-suitcase-lg me-1"></i> Browse Packages
            </a>
        </div>
    </div>
</div>
{% endblock %}
